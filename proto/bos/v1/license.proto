syntax = "proto3";

package braiins.bos.v1;

import "bos/v1/units.proto";

option go_package = "github.com/braiins/bos-plus-api/braiins/bos/v1;bos_proto_v1";

enum LicenseType {
  LICENSE_TYPE_UNSPECIFIED = 0;
  LICENSE_TYPE_STANDARD = 1;
  LICENSE_TYPE_CUSTOM = 2;
}

message NoneLicense {
  // BOS Initialization timeout - number of seconds elapsed since bosminer start
  // i.e., number of seconds BOS will start mining in restricted mode burning 5% of hashrate
  // For more, see Section 3.10 of https://braiins.com/os/plus/license
  uint32 time_to_restricted = 1;
}

message LimitedLicense {}

message ValidLicense {
  // License type
  LicenseType type = 1;
  // Contract name
  string contract_name = 2;
  // Current license expiration - number of seconds since the moment the license was received
  // i.e., number of seconds BOS will start mining in restricted mode burning 15% of hashrate
  uint32 time_to_restricted = 3;
  // Defines how much DevFee should be generated by the device.
  bos.v1.BasesPoints dev_fee = 4;
}

message ExpiredLicense {
  // License type
  LicenseType type = 1;
  // Contract name
  string contract_name = 2;
  // Defines how much DevFee should be generated by the device.
  bos.v1.BasesPoints dev_fee = 3;
}

message GetLicenseStateRequest {}

message GetLicenseStateResponse {
  oneof state {
    NoneLicense none = 1;
    LimitedLicense limited = 2;
    ValidLicense valid = 3;
    ExpiredLicense expired = 4;
  }
}

message ApplyContractKeyRequest {
  // Licence contract key string
  string contract_key = 1;
  // Flag if an already installed license should be kept. When set to true, an already installed
  // license is kept untouched and the new contract key is not applied. When set to false or
  // omitted, the license is overwritten by the new contract key. The flag is ignored when no
  // contract key was applied before; the new contract key is always applied in that case.
  optional bool keep_existing = 2;
}

message ApplyContractKeyResponse {
  // Flag if custom license was successfully installed. It is `true` when the new license was
  // downloaded and installed, both when no contract key was applied before and when a previously
  // installed license was overwritten. It is `false` when `keep_existing` was set and an already
  // installed license was kept untouched regardless of its current state, so the new key was not
  // applied. Any failure to download or install the new license is reported as an error instead;
  // when an existing license was being overwritten, it may already have been removed at that point
  // and is not restored.
  bool successful = 1;
}

service LicenseService {
  rpc GetLicenseState(GetLicenseStateRequest) returns (GetLicenseStateResponse);
  // Apply contract key. Bosminer is not restarted automatically; when `successful` is `true`,
  // restart bosminer for the new license to take effect.
  rpc ApplyContractKey(ApplyContractKeyRequest) returns (ApplyContractKeyResponse);
}
